name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.2"
      MDBOOK_MERMAID_VERSION: "0.17.0" # 指定与mdbook 0.5.2兼容的版本
    steps:
      - uses: actions/checkout@v4

      # 1. 首先设置缓存（修复顺序错误）
      - name: 缓存 Cargo 编译产物及二进制文件
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-mdbook-mermaid-v${{ env.MDBOOK_MERMAID_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      # 2. 安装Rust和工具链
      - name: 安装 Rust 工具链
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 3. 安装指定版本的mdbook和mdbook-mermaid
      - name: 安装 mdBook 和 mdbook-mermaid
        run: |
          cargo install --version ${MDBOOK_VERSION} mdbook --force
          cargo install --version ${MDBOOK_MERMAID_VERSION} mdbook-mermaid --force

      # 4. 配置并构建mdBook
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build
        env:
          RUST_LOG: debug # 添加调试日志

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
